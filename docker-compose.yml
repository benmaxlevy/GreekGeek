services:
  postgres:
    image: postgres:17-alpine
    container_name: greekgeek-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: greekgeek
      POSTGRES_PASSWORD: greekgeek
      POSTGRES_DB: greekgeek
    volumes:
      - greekgeek_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greekgeek -d greekgeek"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: greekgeek-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - greekgeek_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  greekgeek_pg_data:
  greekgeek_redis_data:
