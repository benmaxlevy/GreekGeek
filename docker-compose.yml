services:
  postgres:
    image: postgres:17-alpine
    container_name: rally-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rally
      POSTGRES_PASSWORD: rally
      POSTGRES_DB: rally
    volumes:
      - rally_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rally -d rally"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rally_pg_data:
